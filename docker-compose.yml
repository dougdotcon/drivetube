version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "3333"
    environment:
      - PORT=3333
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=http://localhost:3000/api/auth/callback/google
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=drivetube
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - drivetube-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3333
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - drivetube-network
      - web_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_public"
      - "traefik.http.middlewares.drivetube-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.drivetube-https.redirectscheme.permanent=true"
      - "traefik.http.middlewares.drivetube-addslash.redirectregex.regex=^(https?://[^/]+/drivetube)$$"
      - "traefik.http.middlewares.drivetube-addslash.redirectregex.replacement=$${1}/"
      - "traefik.http.routers.drivetube-secure.rule=(Host(`asimovtechsystems.com.br`) || Host(`www.asimovtechsystems.com.br`)) && PathPrefix(`/drivetube`)"
      - "traefik.http.routers.drivetube-secure.entrypoints=websecure"
      - "traefik.http.routers.drivetube-secure.middlewares=drivetube-addslash"
      - "traefik.http.routers.drivetube-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.drivetube-secure.service=drivetube-svc"
      - "traefik.http.services.drivetube-svc.loadbalancer.server.port=3000"

  postgres:
    image: postgres:14
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=drivetube
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  drivetube-network:
    driver: bridge
  web_public:
    external: true